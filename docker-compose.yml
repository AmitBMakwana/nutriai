services:
  mysql:
    image: mysql:8
    container_name: nutriai-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: nutriai
      MYSQL_USER: nutriai
      MYSQL_PASSWORD: password
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:alpine
    container_name: nutriai-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  mailpit:
    image: axllent/mailpit
    container_name: nutriai-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  api:
    build:
      context: ./apps/api
      dockerfile: ../../docker/Dockerfile.api
    container_name: nutriai-api
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/var/www/html
    depends_on:
      - mysql
      - redis

volumes:
  mysql-data:
  redis-data:
